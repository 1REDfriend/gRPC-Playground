# A headless Service (clusterIP: None) makes DNS return every pod IP
# instead of one virtual IP, so client-side round_robin can see all pods.
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  clusterIP: None
  selector:
    app: orders
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
# client target: dns:///orders.default.svc.cluster.local:50051
